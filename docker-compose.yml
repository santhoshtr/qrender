services:
  app:
    image: rust:alpine
    command: sleep infinity
    volumes:
      - .:/workspaces/qrender:cached
    environment:
      TOOL_REDIS_URI: redis://redis:6379
    depends_on:
      - redis
    ports:
      - "4243:4243"
  redis:
    image: redis:8-alpine
    restart: unless-stopped
