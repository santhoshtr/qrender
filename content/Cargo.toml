[package]
name = "content"
description = "Layer 1: the content of a Wikidata item, and its text in one language"
version.workspace = true
authors.workspace = true
edition.workspace = true

[features]
fetch = ["dep:futures", "dep:regex", "dep:reqwest", "dep:scraper", "dep:tokio"]
cache = ["fetch", "dep:redis"]

[dependencies]
futures = { version = "0.3", optional = true }
indexmap.workspace = true
percent-encoding.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
redis = { version = "1", features = ["tokio-comp"], optional = true }
regex = { version = "1", optional = true }
reqwest = { version = "0.13", features = ["json", "query"], optional = true }
scraper = { version = "0.24", optional = true }
tokio = { version = "1", features = ["sync", "time"], optional = true }
