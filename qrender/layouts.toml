# Judgment for the composer. Everything the composer cannot derive from
# the data is here, one decision to a line, with the label of each PID and
# QID. The composer reads this file and the content layer; nothing else.
#
# Two kinds of judgment:
# - class layouts: which spreads a kind of item has, in which order, and the
#   properties each spread shows. The first spread that lists a statement's
#   property shows it; a statement no spread lists goes to "more", collapsed
#   at the end, so no data is lost.
# - property roles: what a property is for, when its datatype does not say.

# ============================================================ class layouts
#
# A spread has an id, a concept (the Wikidata item that titles it), prose
# concepts (items whose label or alias names an article section for it), a
# kind (how the composer builds it) and the properties it takes. Kinds:
#   identity  the page head: title and description, banner, lead beside the picture, kinds
#   facts     the properties listed, each by the shape of its data
#   scale     share of the container, peers, series of the properties listed
#   history   a time axis of events and history spans (property roles)
#   media     the Commons files no spread took
#   more      everything left, collapsed
#   evidence  web presence, curation, sources, identifiers, provenance

