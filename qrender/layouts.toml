# ========================================================== property roles
#
# What a property is for, when its datatype does not say. Community-editable
# data: the strategy document's property-to-role mapping.

[roles]
# Events that are items of their own: the timeline of the history spread,
# a row for each event with its picture and description, by date (the
# statement's, else the event item's own).
timeline = [
  "P793",   # significant event
]
# Holidays: a list in the order of the year, a row for each with its day
# ("July 4", "fourth Thursday in November") as its date.
calendar = [
  "P832",   # public holiday
]
# Values that are classes, with a picture that stands for them: the symbol
# of a religion. Their pictures are shown, as for other values; the
# picture of another class (a "city") would show an example only.
symbol = [
  "P140",   # religion or worldview
]
# The people who made a work. A spread shows them as one block, each person
# once, with every role they had (a director who also wrote and produced).
crew = [
  "P57",    # director
  "P58",    # screenwriter
  "P162",   # producer
  "P1431",  # executive producer
  "P86",    # composer
  "P344",   # director of photography
  "P1040",  # film editor
  "P2554",  # production designer
  "P3092",  # film crew member
]
# Review scores: a card each, with the logo of the source.
score = [
  "P444",   # review score
]
# Values whose Wikidata description is shown under them: works, where the
# description says what the work is ("novel by Thomas Pynchon"). Not for
# classes ("drama film"), whose descriptions are general.
described = [
  "P144",   # based on
  "P1877",  # after a work by
  "P6166",  # quotes work
]
# Values with an order of importance that Wikidata does not record (who is
# billed first). The count of references on each statement stands in for
# it; ties break on the item number, which is the same in every language.
billing = [
  "P161",   # cast member
  "P725",   # voice actor
]
# People and organisations in the life of the item. An end date (a divorce,
# a death, the end of a membership) does not make the value former: it is
# part of the item's story, so the value is pictured with its dates like any
# other. Ended values of other properties (a former country) are a list.
relation = [
  "P26",    # spouse
  "P451",   # unmarried partner
  "P102",   # member of political party
  "P463",   # member of
  "P108",   # employer
  "P69",    # educated at
]
# Points that mark the extent of the item, and its geographic centre:
# markers on its map.
extreme_point = ["P1332", "P1333", "P1334", "P1335", "P5140"]
# Sites and accounts: the item on the web, as cards in the web spread.
web = [
  "P856",   # official website
  "P78",    # top-level Internet domain
  "P2002",  # X username
  "P2013",  # Facebook username
  "P2003",  # Instagram username
  "P2397",  # YouTube channel ID
  "P11245", # YouTube handle
  "P4264",  # LinkedIn company ID
  "P7085",  # TikTok username
  "P4033",  # Mastodon address
  "P3984",  # subreddit
  "P3417",  # Quora topic ID
  "P2572",  # hashtag
  "P1482",  # Stack Exchange tag
  "P10311", # official jobs URL
  "P11266", # contact page URL
  "P8402",  # open data portal
  "P8687",  # social media followers
  "P973",   # described at URL
  "P1581",  # official blog URL
]
# The pages of the item on Commons, by their name: links in the media
# spread. A category name has the "Category:" namespace in its link.
commons_category = [
  "P373",   # Commons category
]
commons_gallery = [
  "P935",   # Commons gallery
]
# Properties whose values are often near duplicates (another drawing of
# the same map). The page shows the values of the best rank: the preferred
# values, if there are any; else all. The other values are set aside: in
# the data, not on the page.
best_rank = [
  "P2716",  # collage image
  "P242",   # locator map image
  "P1944",  # relief location map
  "P1621",  # detail map
  "P1766",  # place name sign
  "P421",   # located in time zone
]

# A Commons data file that holds a series, and the property of the dated
# statements that the file replaces. The current value of that property
# stays as a fact; the file's series shows the dated ones.
[roles.tabular]
P4179 = "P1082"  # tabular population -> population

# An office holder and the property that names the office: a succession
# block, with the office as its title.
[roles.office]
P6 = "P1313"     # head of government -> office held by head of government
P35 = "P1906"    # head of state -> office held by head of state

# An item property and the property of the file that pictures its value:
# one picture of the file, titled by the item ("flag: flag of Germany").
[roles.picture]
P163 = "P41"     # flag -> flag image
P237 = "P94"     # coat of arms -> coat of arms image

# ----------------------------------------------------------------- splits
# Properties whose values in one year divide one whole. The whole is the
# sum of the parts, so the shares add up to 100 %. A split is one chart
# with a line for each part when every part is a series, else a bar for
# each year that every part has. The concept titles it; the parts are in
# the order of their colours.

[[splits]]
id = "sex"
concept = "Q290"       # sex
parts = [
  "P1539",  # female population
  "P1540",  # male population
]

[[splits]]
id = "urbanization"
concept = "Q161078"    # urbanization
parts = [
  "P6343",  # urban population
  "P6344",  # rural population
]

[[splits]]
id = "literacy"
concept = "Q8236"      # literacy
parts = [
  "P6499",  # literate population
  "P6498",  # illiterate population
]

# ---------------------------------------------------------------- indexes
# A value on a scale (Gini coefficient 35.7 of 0 to 100): in its row, a
# marker on a track from the lowest to the highest value. The scale is the
# range constraint of the property on Wikidata; a range here is for a
# property without one. Only the properties listed: a range constraint
# can be a sanity bound, not a scale (suicide rate: 0 to 400; total
# fertility rate: 0 to 100). A percentage with the range 0 to 100 is a
# proportion and needs no entry.
[indexes]
P1125 = {}                        # Gini coefficient (0 to 100)
P11547 = { min = 0, max = 100 }   # Happy Planet Index score
P1081 = {}                        # Human Development Index (0 to 1)
P11593 = {}                       # Inequality-adjusted Human Development Index (0 to 1)
P8328 = {}                        # Democracy Index (0 to 10)
P8476 = {}                        # BTI Governance Index (0 to 10)
P8477 = {}                        # BTI Status Index (0 to 10)

# ------------------------------------------------------------- thresholds
[thresholds]
peers = 5                # fewer peers with a value than this: no peer lineup
run_pictured = 0.5       # a set of values is pictured when half have pictures
set_max = 12             # pictures shown in a set before "+N"
absence = 0.6            # a property most peers have: 60 % of them
absence_min_peers = 20   # fewer peers than this: no absence is shown
chain_max = 5            # classes shown in the identity chain
list_shown = 12          # works shown in a list before "+N"
row_shown = 6            # values shown in a row of the fact sheet before "+N"
succession_shown = 6     # predecessors shown before "+N"

# ------------------------------------------------------------ comparisons
[containers]
P397 = "scale"           # parent astronomical body
P171 = "scale"           # parent taxon
P17 = "share"            # country
P131 = "share"           # located in the administrative territorial entity
P361 = "share"           # part of

