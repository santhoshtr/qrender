{#- A subsection of an article section, collapsed to its title: its blocks
    and its own subsections. -#}
{%- let h = ui.section_tag(s.level) -%}
<details class="subsection">
    <summary><{{ h }}>{{ s.title }}</{{ h }}></summary>
    {{- ui.article_blocks(s.blocks)|safe -}}
    {%- for c in s.sections %}{{ ui.article_subsection(c)|safe }}{% endfor -%}
</details>
