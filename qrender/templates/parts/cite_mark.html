{#- The sources of a statement: a button with the icon of a reference (and
    their number, when there is more than one), and a popover with a card
    for each. The same icon for every statement: not the logos of sites. -#}
<button class="src"
        type="button"
        popovertarget="p{{ n }}"
        aria-label="{{ ui.msg("qrender-sources") }}">
    {{- ui.reference_icon()|safe -}}
    {%- if cards.len() > 1 %}<span class="count">{{ cards.len() }}</span>{% endif -%}
</button><span id="p{{ n }}" popover class="pop cites">{% for c in cards %}{{ ui.cite(c)|safe }}{% endfor %}</span>
