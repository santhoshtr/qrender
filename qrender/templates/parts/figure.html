{%- import "macros.html" as m -%}
{#- The picture of an item value: its own, or a page image (marked W), or
    an empty slot that asks for one. -#}
{%- match s.image -%}
{%- when None -%}
<figure class="m k-empty" style="--a:1.333">
    <figcaption><b>{{ ui.part(s.part)|safe }}</b>
        {%- if let Some(d) = s.description %}<span class="desc">
            {% call m::description(d) %}
            {% endcall %}
            </span>
        {% endif -%}
        {%- if !s.note.is_empty() %}<span>{{ ui.note(s.note.as_slice())|safe }}</span>{% endif -%}
        {% call m::prov(ui, s.provenance, s.citations) %}
        {% endcall %}
    </figcaption>
    <span class="tools">
        {% if let Some(e) = s.edit %}
            {% call m::edit(ui, e) %}
            {% endcall %}
        {% endif %}
    </span>
</figure>
{%- when Some with (image) -%}
<figure class="m k-{{ image.picture.facts.kind.name() }}"
        style="--a:{{ ui.aspect(image.picture.facts.aspect) }}">
    <img src="{{ ui.src(&image.picture.file, 960) }}"
         srcset="{{ ui.srcset(&image.picture.file) }}"
         sizes="(max-width: 760px) 50vw,
                20vw"
         alt=""
         loading="lazy">
    <figcaption><b>{{ ui.part(s.part)|safe }}</b>
        {%- if let Some(d) = s.description %}<span class="desc">
            {% call m::description(d) %}
            {% endcall %}
            </span>
        {% endif -%}
        {%- if let Some(from) = image.from %}<span class="from" title="{{ from }}">W</span>{% endif -%}
        {%- if !s.note.is_empty() %}<span>{{ ui.note(s.note.as_slice())|safe }}</span>{% endif -%}
    {% call m::prov(ui, s.provenance, s.citations) %}{% endcall %}</figcaption><span class="tools">{{ ui.credit(&image.picture.facts.credit)|safe }}{% if let Some(e) = s.edit %}{% call m::edit(ui, e) %}{% endcall %}{% endif %}</span></figure>
{%- endmatch -%}
