{#- The action to translate a text of the article into the page language,
    and to edit the translation after a save. Hidden: the script shows it
    (a page without the script has no editor). -#}
<button class="translate" type="button" lang="{{ ui.view.lang }}" hidden><span class="new">{{ ui.translate_label()|safe }}</span><span class="edit" hidden>{{ ui.msg("qrender-edit-translation") }}</span></button>
