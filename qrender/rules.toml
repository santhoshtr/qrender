# The decisions of the composer, as ordered rule tables. In each table the
# first rule whose conditions all hold wins. A condition is an AND of named
# predicates (qrender/src/compose/facts.rs lists them). A rule without
# `when` always holds, and every table ends with one.
#
# Each block records the id of the rule that made it, so the composition
# says why a value looks the way it looks.

# ------------------------------------------------------------- property
# Before any statement of a property is claimed.

[[property]]
id = "office-title"
when = { office_title = true }   # shown as the title of its succession
make = "skip"

[[property]]
id = "extreme-point"
when = { role = "extreme_point" }  # shown as markers on the map
make = "skip"

[[property]]
id = "office"
when = { role = "office" }
make = "succession"

[[property]]
id = "crew"
when = { role = "crew" }
make = "credits"

[[property]]
id = "values"
make = "values"

# ---------------------------------------------------------------- split
# Values of an item property that ended are history: a group of their own.
# Not for the `relation` role: an ended marriage is part of a life. The
# split table is for item and media properties.

# Holidays stay one list in the order of the year: a holiday that ended
# is in it, with its years (Germany's June 17, 1954 – 1990).
[[split]]
id = "calendar-together"
when = { role = "calendar" }
make = "together"

[[split]]
id = "former-values"
when = { type = "WikibaseItem", relation = false }
make = "split-ended"

# The files of a media property that ended (the flags before the current
# one) are earlier: a group of their own, shown behind "+N".
[[split]]
id = "former-media"
when = { type = "CommonsMedia" }
make = "split-ended"

[[split]]
id = "together"
make = "together"

# ---------------------------------------------------------------- block
# The block of one group of values.

[[block]]
id = "earlier"
when = { type = "CommonsMedia", former = true }
make = "earlier"

[[block]]
id = "media"
when = { type = "CommonsMedia" }
make = "media"

# A map of the Earth for a coordinate on the Earth. A coordinate on
# another globe (the Moon) is a row, until a map of that globe exists.
[[block]]
id = "coordinate"
when = { type = "GlobeCoordinate", globe = "Q2" }   # Earth
make = "map"

# A role decides before the datatype: review scores are cards, whatever
# the datatype of the score.
[[block]]
id = "score"
when = { role = "score" }
make = "score"

# Quantities dated by point in time, in two or more years: a series. A
# measurement is a series by the shape of its data. A year with two values
# (two sources) needs one preferred value.
# Holidays: a list in the order of the year, their day as the date.
[[block]]
id = "calendar"
when = { role = "calendar" }
make = "calendar"

[[block]]
id = "series"
when = { type = "Quantity", series = true }
make = "series"

[[block]]
id = "former"
when = { type = "WikibaseItem", former = true }
make = "former-list"

[[block]]
id = "few-pictures"
when = { type = "WikibaseItem", mostly_pictured = false }
make = "item-list"

[[block]]
id = "single"
when = { type = "WikibaseItem", few = true }
make = "single"

[[block]]
id = "set"
when = { type = "WikibaseItem" }
make = "network"

[[block]]
id = "row"
make = "fact"

# ---------------------------------------------------------------- order
# The order of the values of a set.

[[order]]
id = "billing"
when = { role = "billing" }
order = "references"

[[order]]
id = "pictured"
order = "pictured"

# ----------------------------------------------------------------- lead
# The first block of one of these primitives leads its spread.

[lead]
primitives = ["succession", "map"]

# ------------------------------------------------------------ placement
# The slot of every block that does not lead.

[[placement]]
id = "single"
when = { make = "single" }       # small values: the gallery of the spread
slot = "gallery"

[[placement]]
id = "row"
when = { primitive = "fact" }
slot = "sheet"

[[placement]]
id = "picture"
when = { primitive = "media", audio = false }
slot = "gallery"

[[placement]]
id = "block"
slot = "stack"

# ------------------------------------------------------------- template
# The template of a facts spread, from its lead.

[[template]]
id = "office"
when = { lead = "succession" }
template = "lead-beside"

[[template]]
id = "map"
when = { lead = "map" }
template = "hero-plus-stack"

[[template]]
id = "plain"
template = "columns"
