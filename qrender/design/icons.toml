# The icon at the start of the label of a composed item (a fact row, a
# box, a map card, ...). The icon of the property that the label names;
# else the icon of the datatype of its value; else the fallback.
#
# The names are in qrender/src/render/icons.rs: Codex icons first
# (camelCase), Material Symbols where Codex has none (snake_case).

# Every composed item has an icon: this one when no other applies.
fallback = "puzzle"

# By the datatype of the value: only where the icon is correct for every
# property of the datatype.
[datatypes]
Time = "calendar"
GlobeCoordinate = "mapPin"
Url = "link"

# By the property that the label names.
