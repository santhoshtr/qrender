[workspace]
resolver = "3"
members = ["app", "content", "qrender"]
exclude = ["legacy", "prototype"]

[workspace.package]
version = "0.1.0"
authors = ["Santhosh Thottingal <santhosh.thottingal@gmail.com>"]
edition = "2024"

[workspace.dependencies]
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2"
schemars = { version = "1", features = ["indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "1", features = ["preserve_order"] }
